<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <title>My Kitchen · Plateful</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <style>
      .bar {
        display: flex;
        border: 2px solid var(--primary);
        border-radius: 14px;
        background: #fff;
        padding: 0.4rem;
        max-width: 640px;
        margin: 1rem 0;
      }
      .bar input {
        flex: 1;
        border: 0;
        font: inherit;
        padding: 0.6rem 1rem;
        min-width: 0;
        background: none;
      }
      .bar input:focus {
        outline: none;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.6rem 0 1.2rem;
      }
      .ing {
        background: #fff3e0;
        border: 1px solid var(--secondary);
        color: #8a5200;
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
        font: inherit;
      }
      .quick {
        cursor: pointer;
        font: inherit;
        transition: background 0.2s;
      }
      .quick:hover {
        background: #e8f5e9;
        border-color: var(--primary);
      }
      .grid {
        margin-top: 1rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
      }
      .grid > .card,
      .grid > article {
        flex: 1 1 230px;
        max-width: 340px;
      }
      .miss {
        font-size: 0.85rem;
        margin-top: 0.5rem;
        color: var(--muted);
      }
      .ok {
        color: var(--primary);
        font-weight: 500;
      }
      .empty {
        background: #fff;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <main class="wrap">
      <h1 style="font-size: 2rem; font-weight: 700">My Kitchen</h1>
      <p style="color: var(--muted)">
        Tell us what you already have. We'll show what you can cook and what's
        missing.
      </p>
      <form class="bar" id="form">
        <input
          id="q"
          placeholder="Add an ingredient, e.g. rice"
          aria-label="Add ingredient"
        /><button class="btn">Add</button>
      </form>
      <div class="tags" id="have" aria-label="Your ingredients"></div>
      <h3
        style="font-size: 0.95rem; color: var(--muted); margin-bottom: 0.5rem"
      >
        Quick add
      </h3>
      <div class="tags" id="quick"></div>
      <h2 style="font-size: 1.4rem; margin-top: 2rem">Recipes you can make</h2>
      <div class="grid" id="grid"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/modal.js"></script>
    <script>
      document.getElementById("nav").innerHTML = NAV("kitchen");
      ready.then(() => {
        const $ = (id) => document.getElementById(id);
        let have = Pantry.list();
        const COMMON = [
          "garlic",
          "onion",
          "olive oil",
          "rice",
          "pasta",
          "egg",
          "milk",
          "tomato",
          "lemon",
          "chicken",
        ];
        function add(s) {
          s = s.trim().toLowerCase();
          if (s && !have.includes(s)) {
            have.push(s);
            Pantry.set(have);
          }
          render();
        }
        $("form").onsubmit = (e) => {
          e.preventDefault();
          $("q").value.split(",").forEach(add);
          $("q").value = "";
        };
        $("have").onclick = (e) => {
          const b = e.target.closest(".ing");
          if (b) {
            have.splice(+b.dataset.i, 1);
            Pantry.set(have);
            render();
          }
        };
        $("quick").onclick = (e) => {
          const b = e.target.closest(".quick");
          if (b) add(b.textContent);
        };
        function render() {
          $("have").innerHTML = have.length
            ? have
                .map(
                  (s, i) =>
                    `<button class="ing" data-i="${i}" aria-label="Remove ${esc(s)}">${esc(s)} ×</button>`,
                )
                .join("")
            : `<span style="color:var(--muted)">Nothing added yet</span>`;
          $("quick").innerHTML = COMMON.filter((c) => !have.includes(c))
            .map((c) => `<button class="chip quick">${c}</button>`)
            .join("");
          const res = RECIPES.map((r) => {
            const miss = r.ingredients.filter(
              (i) => !have.some((h) => ingMatch(i, h)),
            );
            return { r, miss };
          })
            .filter((x) => x.miss.length < x.r.ingredients.length)
            .sort((a, b) => a.miss.length - b.miss.length);
          $("grid").innerHTML = !have.length
            ? `<p class="empty" style="flex:1 1 100%;max-width:none">Add a few ingredients above to see matching recipes.</p>`
            : res.length
              ? res
                  .map(
                    ({ r, miss }) =>
                      `<article class="card"><a href="recipe.html?id=${r.id}" data-open="${r.id}"><div class="img" style="background:${r.img}"></div><div class="body"><h3>${r.title}</h3><div class="meta">${r.time} min <span class="tag ${r.difficulty}">${r.difficulty}</span></div><div class="miss">${miss.length ? "Missing: " + miss.join(", ") : '<span class="ok">You have everything</span>'}</div></div></a></article>`,
                  )
                  .join("")
              : `<p class="empty" style="flex:1 1 100%;max-width:none">No recipes use these yet. Try adding more ingredients.</p>`;
        }
        render();
      });
    </script>
  </body>
</html>
