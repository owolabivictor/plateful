<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <title>Recipe · Plateful</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <style>
      .hero {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        align-items: flex-start;
      }
      .hero > .pic {
        flex: 1 1 320px;
      }
      .hero > div:last-child {
        flex: 1.2 1 320px;
      }
      .pic {
        height: 380px;
        border-radius: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .pic[style*="url("]::before {
        display: none;
      }
      .pic::before {
        content: "";
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        border: 22px solid rgba(255, 255, 255, 0.28);
        margin-top: 140px;
      }
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .meta {
        display: flex;
        gap: 1rem;
        align-items: center;
        color: var(--muted);
        margin: 0.8rem 0 1.4rem;
        flex-wrap: wrap;
      }
      .btns {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
      }
      .btn.amber {
        background: var(--secondary);
        border-color: var(--secondary);
        color: #212121;
      }
      .btn.amber:hover {
        background: #f5a623;
      }
      .btn.on {
        background: #e8f5e9;
      }
      .cols {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        margin-top: 2.5rem;
      }
      .cols > div:first-child {
        flex: 1 1 300px;
        min-width: 0;
      }
      .cols > div:last-child {
        flex: 1.3 1 340px;
        min-width: 0;
      }
      h2 {
        font-size: 1.4rem;
        margin: 0 0 1rem;
      }
      .servings {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin-bottom: 1rem;
        color: var(--muted);
      }
      .servings button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid var(--primary);
        background: #fff;
        color: var(--primary);
        font-size: 1.2rem;
        cursor: pointer;
        line-height: 1;
      }
      .servings button:hover {
        background: #e8f5e9;
      }
      .servings b {
        color: var(--text);
        min-width: 5.5ch;
        text-align: center;
      }
      .ings label {
        display: flex;
        gap: 0.7rem;
        align-items: center;
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .ings input {
        accent-color: var(--primary);
        width: 18px;
        height: 18px;
      }
      .ings input:checked + span {
        text-decoration: line-through;
        color: var(--muted);
      }
      .nutri {
        display: flex;
        gap: 0.8rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      .nutri div {
        flex: 1;
        min-width: 90px;
        text-align: center;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.9rem 0.4rem;
      }
      .nutri b {
        display: block;
        font: 700 1.4rem Poppins;
        color: var(--primary);
      }
      .nutri span {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .steps {
        list-style: none;
        padding: 0;
        margin: 0;
        counter-reset: s;
      }
      .steps li {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.3rem;
        counter-increment: s;
      }
      .steps li::before {
        content: counter(s);
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
      }
      .steps small {
        color: var(--muted);
        display: block;
      }
      .err {
        text-align: center;
        padding: 4rem 1rem;
      }
      dialog {
        border: 0;
        border-radius: var(--radius);
        padding: 1.5rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      #planDlg {
        width: min(380px, 92vw);
      }
      #planDlg select {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        font: inherit;
        margin: 0.4rem 0 1rem;
        background: #fff;
      }
      #planDlg .row {
        display: flex;
        gap: 0.6rem;
        margin-top: 0.5rem;
      }
      #planDlg .row .btn {
        flex: 1;
      }
      #cook {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        margin: 0;
        border-radius: 0;
        padding: 0;
        background: #fafafa;
      }
      #cook[open] {
        display: flex;
        flex-direction: column;
      }
      .ctop {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      .bar {
        height: 6px;
        background: var(--border);
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--primary);
        transition: width 0.3s;
      }
      .cbody {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
        gap: 1.5rem;
        overflow: auto;
      }
      .cbody p {
        font: 600 clamp(1.5rem, 4vw, 2.6rem)/1.3 Poppins;
        max-width: 900px;
        margin: 0;
      }
      .timer {
        font: 700 3rem Poppins;
        color: var(--primary);
      }
      .timer.done {
        color: #c0504d;
      }
      .cfoot {
        display: flex;
        gap: 1rem;
        padding: 1rem 1.5rem;
        background: #fff;
        border-top: 1px solid var(--border);
      }
      .cfoot .btn {
        flex: 1;
        padding: 1.1rem;
      }
      .cfoot .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        background: #202522;
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 99;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 760px) {
        .pic {
          height: 240px;
        }
        .pic::before {
          width: 200px;
          height: 200px;
          margin-top: 100px;
        }
      }
      @media print {
        .nav,
        .btns,
        .servings button,
        #cookBtn {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <main class="wrap" id="main"></main>
    <dialog id="planDlg">
      <h2 style="font-size: 1.2rem">Add to meal plan</h2>
      <label>Day<select id="pDay"></select></label
      ><label>Meal<select id="pMeal"></select></label>
      <div class="row">
        <button class="btn ghost" id="pCancel" type="button">Cancel</button
        ><button class="btn" id="pAdd" type="button">Add</button>
      </div>
    </dialog>
    <dialog id="cook" aria-label="Cooking mode">
      <div class="ctop">
        <b id="cTitle"></b><span id="cCount"></span
        ><button class="btn ghost" id="cClose" type="button">Exit</button>
      </div>
      <div class="bar"><i id="cBar"></i></div>
      <div class="cbody">
        <p id="cText"></p>
        <div class="timer" id="cTimer" hidden></div>
        <button class="btn ghost" id="cTimerBtn" type="button" hidden>
          Start timer
        </button>
      </div>
      <div class="cfoot">
        <button class="btn ghost" id="cPrev" type="button">Back</button
        ><button class="btn" id="cNext" type="button">Next</button>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="js/data.js"></script>
    <script>
      document.getElementById("nav").innerHTML = NAV("search");
      ready.then(() => {
        const $ = (id) => document.getElementById(id),
          R = byId(new URLSearchParams(location.search).get("id")),
          D = R && DETAIL[R.id];
        function toast(m) {
          const t = $("toast");
          t.textContent = m;
          t.classList.add("show");
          clearTimeout(toast.t);
          toast.t = setTimeout(() => t.classList.remove("show"), 2000);
        }
        if (!R || !D) {
          $("main").innerHTML =
            '<div class="err"><h1>Recipe not found</h1><p style="color:var(--muted)">That recipe doesn\'t exist or the link is broken.</p><a class="btn" href="search.html" style="display:inline-block;margin-top:1rem">Browse recipes</a></div>';
          document.title = "Recipe not found · Plateful";
        } else {
          document.title = R.title + " · Plateful";
          let n = D.s;
          $("main").innerHTML =
            `<div class="hero"><div class="pic" style="background:${R.img}"></div><div><h1>${R.title}</h1>
<div class="meta"><span>${R.time} min</span><span class="tag ${R.difficulty}">${R.difficulty}</span><span>${R.cuisine}</span>${R.src ? `<span>via ${R.src}</span>` : ""}${R.diet.map((d) => `<span class="tag">${d}</span>`).join("")}</div>
<div class="btns"><button class="btn amber" id="planBtn" type="button">+ Add to meal plan</button><button class="btn ghost" id="saveBtn" type="button" aria-pressed="false"></button><button class="btn ghost" id="cookBtn" type="button">Start cooking</button></div></div></div>
<div class="cols"><div><h2>Ingredients</h2><div class="servings"><button id="minus" type="button" aria-label="Fewer servings">−</button><b id="srv" aria-live="polite"></b><button id="plus" type="button" aria-label="More servings">+</button></div><div class="ings" id="ings"></div>
<h2 style="margin-top:2rem">Nutrition <small style="font:400 .9rem Inter;color:var(--muted)">per serving</small></h2><div class="nutri">${NUT(D.n)}</div></div>
<div><h2>Instructions</h2><ol class="steps">${D.st.map(([t, m]) => `<li><div>${t}${m ? `<small>${m} min</small>` : ""}</div></li>`).join("")}</ol></div></div>`;
          const FR = { 0.25: "¼", 0.5: "½", 0.75: "¾" };
          function fmt(q) {
            q = (q * n) / D.s;
            if (q >= 100) q = Math.round(q / 5) * 5;
            else q = Math.round(q * 4) / 4;
            const w = Math.floor(q),
              f = FR[q - w];
            return (w ? w : "") + (f || "") || "¼";
          }
          function line([q, t]) {
            if (!q) return t.replace(/\|\w+/, "");
            const v = (q * n) / D.s;
            return fmt(q) + " " + t.replace(/\|(\w+)/, v <= 1 ? "" : "$1");
          }
          function drawIngs() {
            $("srv").textContent = n + (n === 1 ? " serving" : " servings");
            $("ings").innerHTML = D.i
              .map(
                (x, j) =>
                  `<label><input type="checkbox" data-j="${j}" ${CK.includes(j) ? "checked" : ""}><span>${line(x)}</span></label>`,
              )
              .join("");
          }
          let CK = store.get("rf_checked_" + R.id, []);
          $("ings").onchange = (e) => {
            const j = +e.target.dataset.j;
            CK = e.target.checked ? [...CK, j] : CK.filter((x) => x !== j);
            store.set("rf_checked_" + R.id, CK);
          };
          $("minus").onclick = () => {
            if (n > 1) {
              n--;
              drawIngs();
            }
          };
          $("plus").onclick = () => {
            if (n < 12) {
              n++;
              drawIngs();
            }
          };
          drawIngs();
          if (D.i.every((x) => !x[0]))
            document.querySelector(".servings").style.display = "none";
          // save
          function drawSave() {
            const s = Favs.has(R.id);
            $("saveBtn").textContent = s ? "♥ Saved" : "♡ Save";
            $("saveBtn").classList.toggle("on", s);
            $("saveBtn").setAttribute("aria-pressed", s);
          }
          $("saveBtn").onclick = () => {
            toast(
              Favs.toggle(R.id)
                ? "Saved to favorites"
                : "Removed from favorites",
            );
            drawSave();
          };
          drawSave();
          // meal plan
          const DAYS = [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday",
            ],
            MEALS = ["Breakfast", "Lunch", "Dinner"];
          $("pDay").innerHTML = DAYS.map(
            (d, i) =>
              `<option value="${d.slice(0, 3).toLowerCase()}">${d}</option>`,
          ).join("");
          $("pMeal").innerHTML = MEALS.map(
            (m) => `<option value="${m.toLowerCase()}">${m}</option>`,
          ).join("");
          $("pMeal").value = ["breakfast", "lunch", "dinner"].includes(
            R.type.toLowerCase(),
          )
            ? R.type.toLowerCase()
            : "dinner";
          $("pDay").selectedIndex = (new Date().getDay() + 6) % 7;
          $("planBtn").onclick = () => $("planDlg").showModal();
          $("pCancel").onclick = () => $("planDlg").close();
          $("pAdd").onclick = () => {
            const k = planKey(),
              p = store.get(k, {}),
              s = $("pDay").value + "-" + $("pMeal").value,
              old = byId(p[s]);
            p[s] = R.id;
            store.set(k, p);
            $("planDlg").close();
            toast(
              old && old.id !== R.id
                ? `Replaced ${old.title} on ${$("pDay").selectedOptions[0].text} ${$("pMeal").value}`
                : `Added to ${$("pDay").selectedOptions[0].text} ${$("pMeal").value}`,
            );
          };
          // cooking mode
          let si = 0,
            left = 0,
            tick = null,
            lock = null;
          function stopTimer() {
            clearInterval(tick);
            tick = null;
          }
          function fmtT(s) {
            return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
          }
          function showStep() {
            stopTimer();
            const [t, m] = D.st[si];
            $("cText").textContent = t;
            $("cCount").textContent = `Step ${si + 1} of ${D.st.length}`;
            $("cBar").style.width = ((si + 1) / D.st.length) * 100 + "%";
            $("cPrev").disabled = si === 0;
            $("cNext").textContent = si === D.st.length - 1 ? "Finish" : "Next";
            left = (m || 0) * 60;
            $("cTimer").hidden = $("cTimerBtn").hidden = !m;
            $("cTimer").classList.remove("done");
            $("cTimer").textContent = fmtT(left);
            $("cTimerBtn").textContent = "Start timer";
          }
          $("cTimerBtn").onclick = () => {
            if (tick) {
              stopTimer();
              $("cTimerBtn").textContent = "Resume";
              return;
            }
            if (left <= 0) return;
            $("cTimerBtn").textContent = "Pause";
            tick = setInterval(() => {
              left--;
              $("cTimer").textContent = fmtT(left);
              if (left <= 0) {
                stopTimer();
                $("cTimer").textContent = "Time's up!";
                $("cTimer").classList.add("done");
                $("cTimerBtn").hidden = true;
                navigator.vibrate && navigator.vibrate([300, 150, 300]);
              }
            }, 1000);
          };
          $("cookBtn").onclick = async () => {
            si = 0;
            $("cTitle").textContent = R.title;
            showStep();
            $("cook").showModal();
            try {
              lock = await navigator.wakeLock?.request("screen");
            } catch {}
          };
          $("cNext").onclick = () => {
            if (si < D.st.length - 1) {
              si++;
              showStep();
            } else {
              $("cook").close();
              toast("Enjoy your meal! 🍽️");
            }
          };
          $("cPrev").onclick = () => {
            if (si > 0) {
              si--;
              showStep();
            }
          };
          $("cClose").onclick = () => $("cook").close();
          $("cook").addEventListener("close", () => {
            stopTimer();
            lock?.release?.();
            lock = null;
          });
          $("cook").addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") $("cNext").click();
            if (e.key === "ArrowLeft") $("cPrev").click();
          });
        }
      });
    </script>
  </body>
</html>
